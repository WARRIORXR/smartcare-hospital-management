name: SmartCare HMS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Django Tests & Security Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system & migration checks
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-ephemeral-test-secret-key-not-for-production-use-only"
          DEMO_MODE: "False"
          ALLOW_DEMO_ADMIN: "False"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run Django test suite
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-ephemeral-test-secret-key-not-for-production-use-only"
          DEMO_MODE: "False"
          ALLOW_DEMO_ADMIN: "False"
        run: python manage.py test --verbosity=2

  frontend-build:
    name: Frontend Vite Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and build production Vite bundle
        env:
          VITE_API_BASE_URL: https://smartcare-backend-fsb1.onrender.com/api
          VITE_DEMO_MODE: "true"
        run: |
          npm run lint
          npm run build
