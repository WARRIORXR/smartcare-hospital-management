# ============================================================
# render.yaml — Render.com Blueprint (Infrastructure as Code)
# ============================================================
# Deploy this by connecting your GitHub repo to Render.com
# and it auto-detects this file.

services:
  # ── Django Backend API ──
  - type: web
    name: smartcare-backend
    runtime: python
    region: singapore  # Closest to India
    plan: free
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn smartcare.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_URL
        sync: false  # Set manually after Cloudflare Pages deploy
      - key: DATABASE_URL
        fromDatabase:
          name: smartcare-db
          property: connectionString
      - key: DB_ENGINE
        value: postgresql
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: SECURE_SSL_REDIRECT
        value: "False"  # Render handles SSL termination

  # ── PostgreSQL Database ──
databases:
  - name: smartcare-db
    plan: free
    region: singapore
    databaseName: smartcare_db
