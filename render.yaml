# ============================================================
# render.yaml — Render.com Blueprint (Infrastructure as Code)
# ============================================================
# Standalone Web Service using SQLite by default (bypasses Render 1-DB limit)
# If you want PostgreSQL, just paste DATABASE_URL in Render Dashboard.

services:
  # ── Django Backend API ──
  - type: web
    name: smartcare-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn smartcare.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_URL
        value: "https://smartcare-hospital.pages.dev"
      - key: DB_ENGINE
        value: "sqlite"
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: SECURE_SSL_REDIRECT
        value: "False"
